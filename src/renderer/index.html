<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenClaw Desktop</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Vendor libs (bundled locally for offline use) -->
  <script src="vendor/iconify.min.js"></script>
  <script src="vendor/pixi.min.js"></script>
  <script src="vendor/cubism4.min.js"></script>
</head>
<body>
  <!-- Mini-orb mode -->
  <div class="mini-orb" id="mini-orb" style="display: none;">
    <canvas class="mini-orb-canvas" id="mini-orb-canvas" width="52" height="52"></canvas>
    <button class="mini-expand-btn" id="mini-expand-btn" title="Expand">
      <span class="iconify" data-icon="mdi:arrow-expand"></span>
    </button>
    <div class="mini-pulse"></div>
  </div>

  <!-- Main widget -->
  <div class="widget-container" id="widget-container">
    <!-- Speech bubble -->
    <div class="speech-bubble" id="speech-bubble" style="display: none;">
      <div class="bubble-content" id="bubble-text"></div>
      <div class="bubble-arrow"></div>
    </div>

    <!-- Status hint -->
    <div class="status-hint" id="status-hint"></div>

    <!-- Character area -->
    <div class="character-area" id="character-area">
      <canvas id="aura-canvas"></canvas>
      <!-- Listening pulse ring -->
      <div class="listening-pulse-ring hidden" id="listening-pulse-ring">
        <div class="ring-3"></div>
      </div>
      <!-- Live2D canvas (PixiJS renders here, hidden when using sprite mode) -->
      <canvas id="live2d-canvas"></canvas>
      <!-- Character sprite (CSS animation mode) -->
      <div id="character-sprite-container" style="position:absolute;top:0;left:0;width:100%;height:100%;z-index:6;"></div>
      <!-- Tap hint -->
      <div class="tap-hint" id="tap-hint">
        <span class="iconify tap-icon" data-icon="mdi:gesture-tap"></span>
        <span class="tap-text">Tap to start</span>
      </div>
    </div>

    <!-- Bottom bar -->
    <div class="bottom-bar">
      <div class="state-indicator" id="state-indicator">
        <span class="state-dot"></span>
        <span class="state-text" id="state-text">Tap to start</span>
      </div>
      <div class="widget-controls">
        <button id="minimize-btn" class="tiny-btn" title="Minimize">
          <span class="iconify" data-icon="mdi:minus"></span>
        </button>
        <button id="close-btn" class="tiny-btn close" title="Close">
          <span class="iconify" data-icon="mdi:close"></span>
        </button>
      </div>
    </div>

    <!-- Chat history panel (hidden by default, toggle with button) -->
    <div class="chat-history-panel" id="chat-history-panel" style="display: none;">
      <div class="chat-history-header">
        <span>Chat History</span>
        <button class="tiny-btn" id="close-history-btn" title="Close">
          <span class="iconify" data-icon="mdi:close"></span>
        </button>
      </div>
      <div class="chat-history-messages" id="chat-history-messages"></div>
    </div>

    <!-- Text input -->
    <div class="text-input-area">
      <button id="history-btn" class="tiny-btn" title="Chat History">
        <span class="iconify" data-icon="mdi:message-text-clock"></span>
      </button>
      <input type="text" id="text-input" class="text-input" placeholder="Type a message..." />
      <button id="send-btn" class="send-btn" title="Send">
        <span class="iconify" data-icon="mdi:send"></span>
      </button>
    </div>
  </div>

  <script src="orb.js"></script>
  <script src="audio-player.js"></script>
  <script src="character-animator.js"></script>
  <script src="live2d-manager.js"></script>
  <script src="app.js"></script>
</body>
</html>
